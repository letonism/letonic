name: Build Words HTML

on:
  push:
    paths:
      - "words.md"
      - ".github/workflows/build-vocabulary.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install marked
        run: npm install marked

      - name: Build words.html
        run: |
          node --input-type=module <<'EOF'
          import { marked } from "marked";
          import { readFileSync, writeFileSync } from "fs";

          const markdown = readFileSync("words.md", "utf8");
          const body = marked.parse(markdown);

          const html = `<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">

              <title>Letonic Vocabulary</title>

              <style>
                  body {
                      font-family: system-ui, sans-serif;
                      max-width: 1000px;
                      margin: 40px auto;
                      padding: 0 20px;
                  }

                  table {
                      width: 100%;
                      border-collapse: collapse;
                  }

                  th, td {
                      padding: 10px;
                      border: 1px solid #ccc;
                      text-align: left;
                  }

                  th {
                      background: #f5f5f5;
                  }

                  code {
                      font-family: monospace;
                  }
              </style>
          </head>

          <body>
              ${body}
          </body>
          </html>`;

          writeFileSync("words.html", html);
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add words.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build words.html"
            git push
          fi
