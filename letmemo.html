<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvard Leton Cult - Official Notebook ⧖</title>
    <style>
        @font-face {
            font-family: 'Letonic-Regular';
            src: url('https://github.io') format('opentype');
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; 
            color: #e0e0e0;
            font-family: 'Letonic-Regular', 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 2px solid #454545; 
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #ffcc00; 
            margin-bottom: 5px;
            font-weight: normal;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 25px;
        }

        
        textarea {
            width: 100%;
            height: 300px;
            background-color: #111;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 15px;
            font-size: 1.5rem;
            line-height: 1.8;
            font-family: 'Letonic-Regular', 'Noto Sans JP', sans-serif; 
            resize: vertical;
            outline: none;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 10px rgba(255,204,0,0.3);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Harvard Leton Cult — Official Notebook ⧖</h1>
    <div class="subtitle">Letoni-maraŋ Leton</div>
    
    <textarea placeholder="ŋa wari-m su..."></textarea>
    
    <div class="footer">
        © 2026 Harvard Leton Cult. All copyright privileges reserved. Grants fully freedom.
    </div>
</div>

</body>
</html>
